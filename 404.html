<body data-page="404">
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>

  <main class="err-wrap">

    <div class="err-term"><span class="p">$ nmap -sV</span> /priyansh-bhadoria.dev<span class="p">/this-page</span></div>

      <div class="terminal-head">
        <span class="t-dot t-dot-r"></span><span class="t-dot t-dot-y"></span><span class="t-dot t-dot-g"></span>

      <div class="terminal-body" id="terminal-body" aria-live="polite"></div>
      <div class="terminal-input-row">
        <span class="t-prompt">priyansh@portfolio:~$</span>
        <input class="terminal-input" id="terminal-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command input" placeholder="type 'help'...">
      </div>
    </div>
  </div>

  <script src="js/backgrounds.js"></script>
  <script src="js/transition.js"></script>
  <script src="js/glitch.js"></script>
